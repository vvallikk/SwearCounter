<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Счётчик матов — управление</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2129;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f2229;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2d313a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .status { font-size: 14px; color: var(--muted); }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--danger);
      vertical-align: middle;
    }
    .dot.online { background: var(--ok); }
    .count {
      margin: 20px 0;
      font-size: 88px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .buttons { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #inc { background: var(--accent); }
    #reset { background: var(--danger); }
    .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }
    .hint code { user-select: all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Счётчик матов</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Нет связи с сервером</span></div>
    <div id="count" class="count">—</div>
    <div class="buttons">
      <button id="inc">+1 (тест)</button>
      <button id="reset">Сбросить</button>
    </div>
    <div class="hint">Оверлей для OBS: <code id="overlay-url"></code></div>
  </div>

  <script>
    (() => {
      "use strict";
      const countEl = document.getElementById("count");
      const dotEl = document.getElementById("dot");
      const statusEl = document.getElementById("status");
      const incBtn = document.getElementById("inc");
      const resetBtn = document.getElementById("reset");
      document.getElementById("overlay-url").textContent = `${location.origin}/overlay/`;

      function setOnline(online) {
        dotEl.classList.toggle("online", online);
        statusEl.textContent = online ? "Подключено" : "Нет связи с сервером";
      }

      async function post(url, button) {
        button.disabled = true;
        try {
          const resp = await fetch(url, { method: "POST" });
          if (resp.ok) countEl.textContent = (await resp.json()).count;
        } catch (e) {
          setOnline(false);
        } finally {
          button.disabled = false;
        }
      }

      incBtn.addEventListener("click", () => post("/api/increment", incBtn));
      // Подтверждение вторым нажатием, а не confirm(): во встроенных браузерах
      // (док OBS, Simple Browser в VS Code) confirm() молча возвращает false.
      const RESET_LABEL = resetBtn.textContent;
      let resetTimer = null;
      function disarmReset() {
        clearTimeout(resetTimer);
        resetTimer = null;
        resetBtn.textContent = RESET_LABEL;
      }
      resetBtn.addEventListener("click", () => {
        if (resetTimer === null) {
          resetBtn.textContent = "Точно сбросить?";
          resetTimer = setTimeout(disarmReset, 3000);
          return;
        }
        disarmReset();
        post("/api/reset", resetBtn);
      });

      function connect() {
        const proto = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${proto}://${location.host}/ws`);
        ws.onopen = () => setOnline(true);
        ws.onmessage = (event) => {
          try {
            countEl.textContent = JSON.parse(event.data).count;
          } catch (e) {}
        };
        ws.onclose = () => {
          setOnline(false);
          setTimeout(connect, 2000);
        };
        ws.onerror = () => ws.close();
      }
      connect();
    })();
  </script>
</body>
</html>
