name: Antivirus check

# Сборка и проверка на VirusTotal без релиза и без PR: запуск вручную (Actions → Antivirus check)
# или пушем в ветку av-check/*. Ничего не публикует; архив остаётся артефактом на 7 дней.
on:
  workflow_dispatch:
    inputs:
      source_bootloader:
        description: "Собрать загрузчик PyInstaller из исходников (по умолчанию готовый из колёс)"
        type: boolean
        default: false
  push:
    branches: ["av-check/**"]

permissions:
  contents: read

# Повторный пуш отменяет предыдущую сборку: проверка нужна только для последнего коммита.
concurrency:
  group: antivirus-check-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  check:
    runs-on: windows-latest
    # Сборки не побитово одинаковые, и часть движков отвечает нестабильно: три независимые
    # сборки, у каждой ещё две перепроверки.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: base, patch: "true"}
          - {variant: console, patch: "sed -i 's/console=False/console=True/' SwearCounter.spec"}
          - {variant: no-version, patch: "sed -i 's/    version=version_info,//' SwearCounter.spec"}
          - {variant: entry-renamed, patch: "cp swearcounter.py launcher_main.py && sed -i 's/\"swearcounter.py\"/\"launcher_main.py\"/' SwearCounter.spec"}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      # Эксперимент: свой загрузчик. Проверка показала, что он ловится чаще готового,
      # поэтому по умолчанию выключен.
      - name: Rebuild PyInstaller bootloader from source
        if: inputs.source_bootloader
        shell: bash
        run: python -m pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$(grep -i '^pyinstaller==' requirements-build.txt | cut -d= -f3)"

      - name: Patch spec (${{ matrix.variant }})
        shell: bash
        run: ${{ matrix.patch }}

      - name: Build
        run: python scripts/build.py

      - name: Check on VirusTotal
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: python scripts/vt_check.py --rescans 2 dist/SwearCounter-v*-windows.zip dist/SwearCounter/SwearCounter.exe

      - uses: actions/upload-artifact@v7
        with:
          name: SwearCounter-windows-${{ matrix.variant }}
          path: dist/SwearCounter-v*-windows.zip
          retention-days: 7
