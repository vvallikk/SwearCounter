name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Check tag matches app version
        shell: bash
        run: |
          version=$(python -c "import app; print(app.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с __version__ = ${version} (app/__init__.py)"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build
        run: python scripts/build.py

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/SwearCounter-v${VERSION}-windows.zip" \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
