name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read  # скачать артефакт прогона antivirus-check

# Python 3.14 на Windows пишет в консоль в cp1252: без UTF-8 падают print с кириллицей.
env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Check tag matches app version
        shell: bash
        run: |
          version=$(python -c "import app; print(app.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с __version__ = ${version} (app/__init__.py)"
            exit 1
          fi
          if [ ! -f "docs/releases/v${version}.md" ]; then
            echo "::error::Нет заметок к релизу docs/releases/v${version}.md"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # Тесты здесь не гоняем: коммит релиза уже прошёл их в PR (tests.yml), а минуты Actions ограничены.

      # Релиз публикует тот же архив, который уже проверен на VirusTotal: сборки PyInstaller
      # не побитово одинаковые, и пересборка дала бы другой хеш и новый случайный итог.
      # Архив собирает antivirus-check.yml на том же коммите, что и тег (пуш release/vX в
      # ветку av-check/vX или ручной запуск на ветке релиза), см. private/RELEASES.md.
      - name: Download archive from the Antivirus check run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow antivirus-check.yml --commit "$GITHUB_SHA"             --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::Нет успешного прогона Antivirus check для коммита ${GITHUB_SHA}. Соберите и проверьте билд на ветке релиза (Actions → Antivirus check), затем поставьте тег на тот же коммит."
            exit 1
          fi
          echo "Прогон Antivirus check: ${run_id}"
          gh run download "$run_id" -n SwearCounter-windows -D dist
          if [ ! -f "dist/SwearCounter-v${VERSION}-windows.zip" ]; then
            echo "::error::В артефакте нет SwearCounter-v${VERSION}-windows.zip: $(ls dist)"
            exit 1
          fi

      # Если подпись SignPath настроена, в архиве должен быть уже подписанный exe
      # (antivirus-check с sign=true); иначе релиз не выходит.
      - name: Check signature
        shell: pwsh
        run: |
          Expand-Archive "dist/SwearCounter-v$env:VERSION-windows.zip" -DestinationPath dist/unpacked
          $signature = Get-AuthenticodeSignature dist/unpacked/SwearCounter/SwearCounter.exe
          if ($signature.Status -eq "Valid") {
            Write-Output "Подписано: $($signature.SignerCertificate.Subject)"
            "SIGNED=--signed" >> $env:GITHUB_ENV
          } elseif ("${{ vars.SIGNPATH_ORGANIZATION_ID }}" -ne "") {
            throw "SignPath настроен, но exe в проверенном архиве не подписан: запустите Antivirus check с sign=true"
          }

      # SHA-256, отчёт VirusTotal (если задан секрет VT_API_KEY) и подпись в конце описания релиза.
      # Файл уже проверен: VirusTotal отдаёт готовый итог по хешу, повторной загрузки нет.
      - name: Check archive
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          cp "docs/releases/v${VERSION}.md" dist/release-notes.md
          python scripts/release_checks.py "dist/SwearCounter-v${VERSION}-windows.zip" dist/release-notes.md ${SIGNED}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/SwearCounter-v${VERSION}-windows.zip"             --title "${GITHUB_REF_NAME}" --notes-file dist/release-notes.md --verify-tag
