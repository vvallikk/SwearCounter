name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Python 3.14 на Windows пишет в консоль в cp1252: без UTF-8 падают print с кириллицей.
env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Check tag matches app version
        shell: bash
        run: |
          version=$(python -c "import app; print(app.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с __version__ = ${version} (app/__init__.py)"
            exit 1
          fi
          if [ ! -f "docs/releases/v${version}.md" ]; then
            echo "::error::Нет заметок к релизу docs/releases/v${version}.md"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build
        run: python scripts/build.py

      # Подпись exe сертификатом SignPath Foundation (docs/CODE_SIGNING.md). Шаги включаются,
      # когда в настройках репозитория заданы переменные SIGNPATH_* и секрет SIGNPATH_API_TOKEN;
      # без них релиз выходит неподписанным, как раньше.
      - name: Upload exe for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: SwearCounter-unsigned
          path: dist/SwearCounter/SwearCounter.exe
          if-no-files-found: error

      - name: Sign exe with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Запрос подписи подтверждает человек в SignPath: ждём до часа.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Repack archive with signed exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item dist/signed/SwearCounter.exe dist/SwearCounter/SwearCounter.exe -Force
          $signature = Get-AuthenticodeSignature dist/SwearCounter/SwearCounter.exe
          if ($signature.Status -ne "Valid") { throw "Подпись exe недействительна: $($signature.Status)" }
          Write-Output "Подписано: $($signature.SignerCertificate.Subject)"
          python scripts/build.py --archive-only
          "SIGNED=--signed" >> $env:GITHUB_ENV

      # SHA-256, отчёт VirusTotal (если задан секрет VT_API_KEY) и подпись в конце описания релиза.
      - name: Check archive
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          cp "docs/releases/v${VERSION}.md" dist/release-notes.md
          python scripts/release_checks.py "dist/SwearCounter-v${VERSION}-windows.zip" dist/release-notes.md ${SIGNED}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/SwearCounter-v${VERSION}-windows.zip" \
            --title "${GITHUB_REF_NAME}" --notes-file dist/release-notes.md --verify-tag
