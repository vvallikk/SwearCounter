name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Тестам нужен только checkout: токен с правом записи в PR от чужих форков не нужен.
permissions:
  contents: read

# Новый пуш в PR отменяет устаревший прогон; прогоны main не прерываются.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Python 3.14 на Windows пишет в консоль в cp1252: без UTF-8 падают print с кириллицей.
env:
  PYTHONUTF8: "1"

jobs:
  # Если менялась только документация, тесты не нужны. Workflow всё равно запускается:
  # проверка pytest обязательна для слияния в main, а пропущенная засчитывается как пройденная
  # (с paths-ignore PR только с документацией ждал бы её вечно).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Detect code changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE...$PR_HEAD"
          else
            range="$BEFORE..$AFTER"
          fi
          # Новая ветка, force-push или недоступный коммит: проверяем всё.
          if ! changed=$(git diff --name-only "$range" 2>/dev/null) || [ -z "$changed" ]; then
            echo "Не удалось определить изменения ($range), тесты запускаются"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Изменённые файлы:"
          echo "$changed"
          # Только документация. Заметки к релизам (docs/releases) проверяет тест, они считаются кодом.
          docs='^(.*\.md|docs/screenshots/.*|LICENSE|\.gitignore|\.github/(ISSUE_TEMPLATE/.*|FUNDING\.yml|dependabot\.yml))$'
          code_files=$(echo "$changed" | grep -Ev "$docs" || true)
          releases=$(echo "$changed" | grep -E '^docs/releases/' || true)
          if [ -n "$code_files$releases" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Менялась только документация, тесты пропускаются"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Приложение работает только на Windows (MME, sounddevice с встроенным PortAudio).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q

  # macOS и Linux: запуск из исходников. Отдельная проверка, чтобы не менять обязательную pytest.
  # В PR только Linux: раннеры macOS стоят в очереди по 10 минут, а тесты идут полминуты.
  # macOS проверяется после слияния, пушем в main.
  pytest-unix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # На Linux sounddevice берёт PortAudio из системы.
      - name: Install PortAudio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Тесты подменяют движки распознавания и звук; здесь проверяем, что их библиотеки грузятся.
      - name: Load native libraries
        run: python -c "import sounddevice, sherpa_onnx, vosk"

      - name: Run tests
        run: python -m pytest -q
