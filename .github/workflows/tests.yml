name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Тестам нужен только checkout: токен с правом записи в PR от чужих форков не нужен.
permissions:
  contents: read

# Python 3.14 на Windows пишет в консоль в cp1252: без UTF-8 падают print с кириллицей.
env:
  PYTHONUTF8: "1"

jobs:
  pytest:
    # Приложение работает только на Windows (MME, sounddevice с встроенным PortAudio).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -q
