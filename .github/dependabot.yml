# Раз в месяц проверяет зависимости и версии actions, присылает PR с обновлениями.
# Каждый PR запускает тесты, поэтому проверки редкие и обновления собраны в один PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
